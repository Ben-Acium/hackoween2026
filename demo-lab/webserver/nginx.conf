# Hackoween 2026 — minimal nginx config for the Act 1 lab web server.
# Serves ONLY the three known payload files; everything else is 404. No directory
# listing. This limits what a public host exposes, but it is NOT a substitute for a
# firewall allowlist — lock port 80 to the lab egress IP at the host level too.

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    autoindex off;
    server_tokens off;

    # Force a download content-type so the files transfer as bytes, not rendered text.
    default_type application/octet-stream;

    location = /stage.ps1      { }
    location = /RustDesk2.toml { }
    location = /rustdesk.exe   { }

    # Anything else on this public host gets nothing.
    location / { return 404; }
}
